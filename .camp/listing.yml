name: "OER Exchange: moderation queue"
summary: "A Moodle Dashboard block for OER Exchange moderators: an at-a-glance summary of what needs attention, linking straight to the pages that act on it."
description: |
  Sections counting what is outstanding and listing the first few items:

  - **Open resource reports** — reports about a shared resource, oldest first.
  - **Open collection reports** — reports about a curated collection, counted
    and listed separately, because a report is about one or the other.
  - **Failed parses** — the most recent backup uploads whose structure parsing
    failed.
  - **Hidden by moderators** / **Collections taken down** — what moderators
    are currently holding, linking to the Exchange's hidden-content report.
  - **Pending site registrations** — sites still awaiting approval, oldest
    first.

  Each section is gated on its own capability: reports and failed parses on
  `local/oerexchange:moderate`, pending site registrations on
  `local/oerexchange:managesites`. Someone who only approves site registrations
  therefore sees that section and nothing else, and a user holding neither
  capability sees empty content even if an instance somehow ended up on their
  page.

  All data is read directly from `local_oerexchange`'s own tables. This block
  has no database schema, settings or business logic of its own: it is
  presentation-layer only, and Moodle will refuse to install it without
  `local_oerexchange` present.
labels:
  - fully-free
links:
  docs: https://github.com/adamjenkins/moodle-block_oerexchangemodqueue#readme
  issues: https://github.com/adamjenkins/moodle-block_oerexchangemodqueue/issues
